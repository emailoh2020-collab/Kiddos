name: Build SafeShield APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout SafeShield
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # --------------------------------------------------
      # 3. Node.js 20
      # --------------------------------------------------
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            **/package-lock.json

      # --------------------------------------------------
      # 4. Find ZIP
      # --------------------------------------------------
      - name: Find SafeShield ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" \
            ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

          echo "Found ZIP:"
          echo "$ZIP_FILE"

      # --------------------------------------------------
      # 5. Extract ZIP
      # --------------------------------------------------
      - name: Extract SafeShield ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 4 -type f \
            \( -name "gradlew" \
            -o -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "package.json" \
            -o -name "index.html" \) \
            -print

      # --------------------------------------------------
      # 6. Locate Android project
      # --------------------------------------------------
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=""

          while IFS= read -r GRADLE_FILE; do
            DIR=$(dirname "$GRADLE_FILE")

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ]; then
              ANDROID_DIR="$DIR"
              break
            fi
          done < <(find extracted -type f -name "gradlew" -print)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project not found."

            echo "Searching repository:"
            find extracted -maxdepth 6 -type f \
              \( -name "gradlew" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \) \
              -print

            exit 1
          fi

          ANDROID_DIR=$(realpath "$ANDROID_DIR")

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$ANDROID_DIR"

      # --------------------------------------------------
      # 7. Build Web Assets
      # --------------------------------------------------
      - name: Build Web Assets
        shell: bash
        run: |
          set -e

          WEB_DIR=""

          # Find package.json outside the Android project
          PACKAGE_JSON=$(find extracted -type f \
            -name "package.json" \
            ! -path "*/android/*" \
            ! -path "*/node_modules/*" | head -n 1 || true)

          if [ -n "$PACKAGE_JSON" ]; then
            WEB_DIR=$(dirname "$PACKAGE_JSON")

            echo "Web project found:"
            echo "$WEB_DIR"

            cd "$WEB_DIR"

            if [ -f package-lock.json ]; then
              npm ci
            else
              npm install
            fi

            npm run build

            echo "Web build completed."
          else
            echo "No separate web package.json found."
            echo "Using existing dist directory."
          fi

      # --------------------------------------------------
      # 8. Locate Web Build
      # --------------------------------------------------
      - name: Locate Web Build
        shell: bash
        run: |
          set -e

          WEB_DIST=""

          # Prefer the normal dist/index.html
          INDEX_FILE=$(find extracted -type f \
            -path "*/dist/index.html" \
            ! -path "*/node_modules/*" | head -n 1 || true)

          if [ -n "$INDEX_FILE" ]; then
            WEB_DIST=$(dirname "$INDEX_FILE")
          fi

          # Fallback: search any index.html
          if [ -z "$WEB_DIST" ]; then
            INDEX_FILE=$(find extracted -type f \
              -name "index.html" \
              ! -path "*/node_modules/*" \
              ! -path "*/app/src/main/assets/*" | head -n 1 || true)

            if [ -n "$INDEX_FILE" ]; then
              WEB_DIST=$(dirname "$INDEX_FILE")
            fi
          fi

          if [ -z "$WEB_DIST" ]; then
            echo "ERROR: Web build index.html not found."

            find extracted -maxdepth 6 -type f \
              -name "index.html" -print

            exit 1
          fi

          WEB_DIST=$(realpath "$WEB_DIST")

          echo "WEB_DIST=$WEB_DIST" >> "$GITHUB_ENV"

          echo "Web build:"
          echo "$WEB_DIST"

          echo "Web files:"
          find "$WEB_DIST" -maxdepth 3 -type f -print

      # --------------------------------------------------
      # 9. Copy Web Assets Correctly
      # --------------------------------------------------
      - name: Copy Web Assets Into Android
        shell: bash
        run: |
          set -e

          ASSETS_DIR="$ANDROID_DIR/app/src/main/assets"

          echo "Android assets:"
          echo "$ASSETS_DIR"

          mkdir -p "$ASSETS_DIR"

          # IMPORTANT:
          # Remove old assets completely to prevent
          # duplicate resources.
          rm -rf "$ASSETS_DIR/dist"

          mkdir -p "$ASSETS_DIR/dist"

          # Copy ONLY the contents of the web dist folder.
          cp -R "$WEB_DIST"/. "$ASSETS_DIR/dist/"

          echo "Web assets copied successfully."

      # --------------------------------------------------
      # 10. Verify Assets
      # --------------------------------------------------
      - name: Verify Android Web Assets
        shell: bash
        run: |
          set -e

          ASSETS_DIR="$ANDROID_DIR/app/src/main/assets/dist"

          echo "Final Android WebView assets:"
          find "$ASSETS_DIR" -maxdepth 4 -type f -print

          if [ ! -f "$ASSETS_DIR/index.html" ]; then
            echo "ERROR: index.html missing."
            exit 1
          fi

          if [ -d "$ASSETS_DIR/assets/assets" ]; then
            echo "ERROR: Duplicate assets/assets directory detected."
            exit 1
          fi

          echo "Asset verification successful."

      # --------------------------------------------------
      # 11. Make Gradle Executable
      # --------------------------------------------------
      - name: Make Gradle Executable
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          chmod +x ./gradlew

          ls -l ./gradlew

      # --------------------------------------------------
      # 12. Verify Gradle Wrapper
      # --------------------------------------------------
      - name: Verify Gradle Wrapper
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Gradle wrapper files:"
          find gradle -maxdepth 4 -type f -print || true

          if [ ! -f "./gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "ERROR: Official gradle-wrapper.jar is missing."
            exit 1
          fi

          if [ ! -f "./gradle/wrapper/gradle-wrapper.properties" ]; then
            echo "ERROR: gradle-wrapper.properties is missing."
            exit 1
          fi

          ./gradlew --version

      # --------------------------------------------------
      # 13. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      # --------------------------------------------------
      # 14. Find APK
      # --------------------------------------------------
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -path "*/build/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not generated."

            find "$ANDROID_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK=$APK" >> "$GITHUB_ENV"

          echo "APK found:"
          echo "$APK"

          ls -lh "$APK"

      # --------------------------------------------------
      # 15. Upload APK
      # --------------------------------------------------
      - name: Upload SafeShield APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeShield-debug-apk
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 7
