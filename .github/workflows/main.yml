name: Build SafeShield APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SafeShield
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Extract SafeShield ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: SafeShield ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "ZIP extracted successfully."

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find extracted \
            -type f \
            -name "gradlew" \
            -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project not found."
            find extracted -maxdepth 5 -type f | head -200
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Android project found:"
          echo "$ANDROID_DIR"

      - name: Build Web Assets
        shell: bash
        run: |
          set -e

          PACKAGE_JSON=$(find extracted \
            -maxdepth 3 \
            -name "package.json" \
            -not -path "*/android/*" \
            -print -quit)

          if [ -n "$PACKAGE_JSON" ]; then

            PROJECT_DIR=$(dirname "$PACKAGE_JSON")

            echo "Web project:"
            echo "$PROJECT_DIR"

            cd "$PROJECT_DIR"

            npm install
            npm run build

          else

            echo "No package.json found."
            echo "Using existing web assets."

          fi

      - name: Locate Web Build
        shell: bash
        run: |
          set -e

          INDEX=$(find extracted \
            -type f \
            -path "*/dist/index.html" \
            -not -path "*/android/*" \
            -print -quit)

          if [ -z "$INDEX" ]; then

            INDEX=$(find extracted \
              -type f \
              -name "index.html" \
              -not -path "*/android/*" \
              -print -quit)

          fi

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found."
            find extracted -type f -name "*.html"
            exit 1
          fi

          WEB_DIR=$(dirname "$INDEX")

          echo "Web build found:"
          echo "$WEB_DIR"

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

      - name: Copy Web Assets Into Android
        shell: bash
        run: |
          set -e

          DEST="$ANDROID_DIR/app/src/main/assets/dist"

          echo "Source:"
          echo "$WEB_DIR"

          echo "Destination:"
          echo "$DEST"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          cp -R "$WEB_DIR"/. "$DEST"/

          if [ ! -f "$DEST/index.html" ]; then
            echo "ERROR: index.html was not copied."
            exit 1
          fi

          echo "Web assets copied successfully."

      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          gradle --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."

            find "$ANDROID_DIR/app/build/outputs" \
              -type f 2>/dev/null || true

            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload SafeShield APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeShield-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
