name: Build SafeShield APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================
      - name: Checkout SafeShield
        uses: actions/checkout@v4

      # ============================================================
      # 2. Java 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ============================================================
      # 3. Node.js
      # No cache: avoids package-manager lock-file error
      # ============================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ============================================================
      # 4. Android SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ============================================================
      # 5. Find SafeShield ZIP
      # ============================================================
      - name: Find SafeShield ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . \
            -maxdepth 3 \
            -type f \
            -iname "*.zip" \
            -print \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: SafeShield ZIP not found"
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      # ============================================================
      # 6. Extract ZIP
      # ============================================================
      - name: Extract SafeShield ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "===== Extracted structure ====="
          find extracted -maxdepth 4 -type f | head -200

      # ============================================================
      # 7. Locate Android Project
      # ============================================================
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=""

          while IFS= read -r SETTINGS_FILE; do
            CANDIDATE="$(dirname "$SETTINGS_FILE")"

            if [ -f "$CANDIDATE/build.gradle" ] || \
               [ -f "$CANDIDATE/build.gradle.kts" ]; then
              ANDROID_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find extracted \
              -type f \
              \( \
                -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
              \) \
              -print
          )

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            echo "Searching for Gradle files..."
            find extracted -type f \
              \( \
                -name "build.gradle" \
                -o -name "build.gradle.kts" \
                -o -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
              \) -print
            exit 1
          fi

          ANDROID_DIR="$(realpath "$ANDROID_DIR")"

          echo "Android project found:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 8. Locate Web Project
      # ============================================================
      - name: Locate Web Project
        shell: bash
        run: |
          set -e

          WEB_DIR=""

          if [ -f "package.json" ]; then
            WEB_DIR="$(pwd)"
          else
            WEB_PACKAGE=$(find extracted \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print \
              | head -n 1)

            if [ -n "$WEB_PACKAGE" ]; then
              WEB_DIR="$(dirname "$(realpath "$WEB_PACKAGE")")"
            fi
          fi

          if [ -z "$WEB_DIR" ]; then
            echo "WARNING: Web package.json not found"
            echo "WEB_DIR=" >> "$GITHUB_ENV"
            exit 0
          fi

          echo "Web project found:"
          echo "$WEB_DIR"

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

      # ============================================================
      # 9. Build Web Assets
      # ============================================================
      - name: Build Web Assets
        if: env.WEB_DIR != ''
        shell: bash
        working-directory: ${{ env.WEB_DIR }}
        run: |
          set -e

          echo "Installing web dependencies..."

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          echo "Building web application..."

          npm run build

      # ============================================================
      # 10. Locate Web Build
      # ============================================================
      - name: Locate Web Build
        shell: bash
        run: |
          set -e

          WEB_DIST=""

          # Prefer the normal Vite/React output
          if [ -n "${WEB_DIR:-}" ] && [ -d "$WEB_DIR/dist" ]; then
            WEB_DIST="$WEB_DIR/dist"
          fi

          # Otherwise search extracted project
          if [ -z "$WEB_DIST" ]; then
            FOUND_DIST=$(find extracted \
              -type f \
              -name "index.html" \
              -not -path "*/node_modules/*" \
              -print \
              | grep "/dist/" \
              | head -n 1 || true)

            if [ -n "$FOUND_DIST" ]; then
              WEB_DIST="$(dirname "$FOUND_DIST")"
            fi
          fi

          if [ -z "$WEB_DIST" ] || [ ! -f "$WEB_DIST/index.html" ]; then
            echo "ERROR: Web build/dist/index.html not found"
            echo "Searching..."
            find extracted -type f \
              -name "index.html" \
              -not -path "*/node_modules/*" \
              -print
            exit 1
          fi

          WEB_DIST="$(realpath "$WEB_DIST")"

          echo "Web build found:"
          echo "$WEB_DIST"

          echo "WEB_DIST=$WEB_DIST" >> "$GITHUB_ENV"

      # ============================================================
      # 11. Copy Web Assets
      #
      # IMPORTANT:
      # Remove old generated assets first.
      # Copy only to assets/dist.
      # Then remove the original dist from extracted tree.
      # This prevents Gradle Duplicate resources.
      # ============================================================
      - name: Copy Web Assets Into Android
        shell: bash
        run: |
          set -e

          ASSETS_DIR="$ANDROID_DIR/app/src/main/assets"

          mkdir -p "$ASSETS_DIR"

          echo "Cleaning old generated web assets..."

          rm -rf "$ASSETS_DIR/dist"

          echo "Creating:"
          echo "$ASSETS_DIR/dist"

          mkdir -p "$ASSETS_DIR/dist"

          echo "Copying web build..."

          cp -a "$WEB_DIST"/. "$ASSETS_DIR/dist/"

          echo "Removing original extracted web build..."

          if [ "$WEB_DIST" != "$ASSETS_DIR/dist" ]; then
            rm -rf "$WEB_DIST"
          fi

          echo "===== Android assets ====="
          find "$ASSETS_DIR" -maxdepth 3 -type f | head -200

      # ============================================================
      # 12. Verify Android Web Assets
      # ============================================================
      - name: Verify Android Web Assets
        shell: bash
        run: |
          set -e

          INDEX_FILE="$ANDROID_DIR/app/src/main/assets/dist/index.html"

          if [ ! -f "$INDEX_FILE" ]; then
            echo "ERROR: Android web index.html not found"
            exit 1
          fi

          echo "SUCCESS:"
          echo "$INDEX_FILE"

      # ============================================================
      # 13. Install Gradle 8.10.2 directly
      #
      # This completely avoids the broken gradle-wrapper.jar
      # ============================================================
      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.10.2"
          GRADLE_DIR="$HOME/gradle-$GRADLE_VERSION"

          if [ ! -d "$GRADLE_DIR" ]; then
            wget -q \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -O /tmp/gradle.zip

            unzip -q /tmp/gradle.zip -d "$HOME"

            rm -f /tmp/gradle.zip
          fi

          echo "GRADLE_HOME=$GRADLE_DIR" >> "$GITHUB_ENV"
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"

          gradle --version

      # ============================================================
      # 14. Verify Gradle
      # ============================================================
      - name: Verify Gradle
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          gradle --version

          echo "Android project:"
          pwd

          echo "Gradle files:"
          find . -maxdepth 3 -type f \
            \( \
              -name "build.gradle" \
              -o -name "build.gradle.kts" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \) -print

      # ============================================================
      # 15. Clean Gradle
      # ============================================================
      - name: Clean Gradle
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          gradle clean --no-daemon --stacktrace

      # ============================================================
      # 16. Build Debug APK
      # ============================================================
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --info

      # ============================================================
      # 17. Find APK
      # ============================================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for APK..."

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            -print \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found"

            find "$ANDROID_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      # ============================================================
      # 18. Upload APK
      # ============================================================
      - name: Upload SafeShield APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeShield-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      # ============================================================
      # 19. Build Summary
      # ============================================================
      - name: Build Summary
        if: always()
        shell: bash
        run: |
          echo "======================================"
          echo "        SafeShield Build Summary"
          echo "======================================"

          if [ -n "${APK_PATH:-}" ] && [ -f "$APK_PATH" ]; then
            echo "BUILD: SUCCESS"
            echo "APK: $APK_PATH"
            ls -lh "$APK_PATH"
          else
            echo "BUILD: FAILED"
          fi
