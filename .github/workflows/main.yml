name: Build SafeShield APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout SafeShield
        uses: actions/checkout@v4

      # ==========================================
      # Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # ==========================================
      # Node.js 20
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # ==========================================
      # Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # Find SafeShield ZIP
      # ==========================================
      - name: Find SafeShield ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: SafeShield ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      # ==========================================
      # Extract ZIP
      # ==========================================
      - name: Extract SafeShield ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 4 -type f | head -200

      # ==========================================
      # Locate Android Project
      # ==========================================
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=""

          while IFS= read -r SETTINGS_FILE; do
            CANDIDATE=$(dirname "$SETTINGS_FILE")

            if [ -d "$CANDIDATE/app" ]; then
              ANDROID_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find extracted -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print
          )

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            echo "Searching for Gradle files..."
            find extracted -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              -print
            exit 1
          fi

          echo "Android project found:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # Locate Web Project
      # ==========================================
      - name: Locate Web Project
        shell: bash
        run: |
          set -e

          WEB_DIR=""

          while IFS= read -r PACKAGE_FILE; do
            CANDIDATE=$(dirname "$PACKAGE_FILE")

            if [ -f "$CANDIDATE/package.json" ]; then
              WEB_DIR="$CANDIDATE"
              break
            fi
          done < <(
            find extracted -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print
          )

          if [ -z "$WEB_DIR" ]; then
            echo "WARNING: package.json not found."

            if [ -d "extracted" ]; then
              WEB_DIR="extracted"
            fi
          fi

          echo "Web project:"
          echo "$WEB_DIR"

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

      # ==========================================
      # Build Web Assets
      # ==========================================
      - name: Build Web Assets
        shell: bash
        run: |
          set -e

          cd "$WEB_DIR"

          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found."
            exit 1
          fi

          if npm run | grep -q " build"; then
            npm run build
          else
            echo "No npm build script found."
          fi

      # ==========================================
      # Locate Web Build
      # ==========================================
      - name: Locate Web Build
        shell: bash
        run: |
          set -e

          WEB_DIST=""

          while IFS= read -r INDEX_FILE; do
            CANDIDATE=$(dirname "$INDEX_FILE")

            case "$CANDIDATE" in
              */node_modules/*)
                continue
                ;;
              */android/*)
                continue
                ;;
            esac

            WEB_DIST="$CANDIDATE"
            break
          done < <(
            find "$WEB_DIR" -type f \
              -path "*/dist/index.html" \
              -print
          )

          if [ -z "$WEB_DIST" ]; then
            while IFS= read -r INDEX_FILE; do
              CANDIDATE=$(dirname "$INDEX_FILE")

              case "$CANDIDATE" in
                */node_modules/*)
                  continue
                  ;;
                */android/*)
                  continue
                  ;;
              esac

              WEB_DIST="$CANDIDATE"
              break
            done < <(
              find "$WEB_DIR" -type f \
                -name "index.html" \
                -not -path "*/node_modules/*" \
                -not -path "*/android/*" \
                -print
            )
          fi

          if [ -z "$WEB_DIST" ]; then
            echo "ERROR: Web index.html not found"
            find "$WEB_DIR" -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Web build found:"
          echo "$WEB_DIST"

          echo "WEB_DIST=$WEB_DIST" >> "$GITHUB_ENV"

      # ==========================================
      # Copy Web Assets
      # ==========================================
      - name: Copy Web Assets Into Android
        shell: bash
        run: |
          set -e

          DEST="$ANDROID_DIR/app/src/main/assets/dist"

          echo "Source:"
          echo "$WEB_DIST"

          echo "Destination:"
          echo "$DEST"

          # Completely remove previous web assets
          rm -rf "$DEST"

          mkdir -p "$DEST"

          # Copy CONTENTS of dist, not dist itself
          cp -a "$WEB_DIST"/. "$DEST"/

          echo "Android assets:"
          find "$DEST" -maxdepth 3 -type f | head -100

          if [ ! -f "$DEST/index.html" ]; then
            echo "ERROR: index.html was not copied"
            exit 1
          fi

      # ==========================================
      # Verify Android Web Assets
      # ==========================================
      - name: Verify Android Web Assets
        shell: bash
        run: |
          set -e

          INDEX="$ANDROID_DIR/app/src/main/assets/dist/index.html"

          if [ ! -f "$INDEX" ]; then
            echo "ERROR: Missing Android assets index.html"
            exit 1
          fi

          echo "Verified:"
          echo "$INDEX"

      # ==========================================
      # Install Gradle 8.10.2
      # ==========================================
      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # ==========================================
      # Make Gradle Executable
      # ==========================================
      - name: Make Gradle Executable
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      # ==========================================
      # Verify Gradle
      # ==========================================
      - name: Verify Gradle
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle --version

      # ==========================================
      # Build Debug APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      # ==========================================
      # Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -name "*-debug.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found"
            find "$ANDROID_DIR" -type f -name "*.apk" -print
            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      # ==========================================
      # Upload APK
      # ==========================================
      - name: Upload SafeShield APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeShield-debug
          path: ${{ env.APK }}
          if-no-files-found: error
