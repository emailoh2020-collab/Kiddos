name: Build SafeShield APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SafeShield
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Extract SafeShield ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: SafeShield ZIP file not found"
            exit 1
          fi

          rm -rf extracted
          mkdir extracted

          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted project:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find extracted -type f -name "gradlew" -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$ANDROID_DIR"

      - name: Build Web Assets
        shell: bash
        run: |
          set -e

          cd extracted

          if [ -f package.json ]; then
            npm install
            npm run build
          else
            echo "No package.json found - using existing web assets"
          fi

      - name: Locate Web Build
        shell: bash
        run: |
          set -e

          INDEX=$(find extracted \
            -type f \
            -path "*/dist/index.html" \
            -not -path "*/android/*" \
            -print -quit)

          if [ -z "$INDEX" ]; then
            INDEX=$(find extracted \
              -type f \
              -name "index.html" \
              -not -path "*/android/*" \
              -print -quit)
          fi

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html not found"
            exit 1
          fi

          WEB_DIR=$(dirname "$INDEX")

          echo "INDEX=$INDEX"
          echo "WEB_DIR=$WEB_DIR"

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

      - name: Copy Web Assets Into Android
        shell: bash
        run: |
          set -e

          DEST="$ANDROID_DIR/app/src/main/assets/dist"

          echo "Source: $WEB_DIR"
          echo "Destination: $DEST"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          cp -R "$WEB_DIR"/. "$DEST"/

          echo "Android assets:"
          find "$DEST" -maxdepth 2 -type f | head -100

          if [ ! -f "$DEST/index.html" ]; then
            echo "ERROR: index.html was not copied"
            exit 1
          fi

          echo "index.html successfully installed."

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "$ANDROID_DIR/gradlew"

      - name: Verify Gradle
        shell: bash
        run: |
          cd "$ANDROID_DIR"
          ./gradlew --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR/app/build/outputs/apk" \
            -type f \
            -name "*.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"
            exit 1
          fi

          echo "APK generated:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload SafeShield APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeShield-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
