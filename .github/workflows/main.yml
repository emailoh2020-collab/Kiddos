name: Build SafeShield APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout SafeShield
        uses: actions/checkout@v4


      # ==========================================
      # Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # Node.js 20
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm


      # ==========================================
      # Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # Find SafeShield ZIP
      # ==========================================
      - name: Find SafeShield ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 3 -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: SafeShield ZIP not found"
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"


      # ==========================================
      # Extract SafeShield
      # ==========================================
      - name: Extract SafeShield ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "Extracted project structure:"
          find extracted -maxdepth 4 -type f | head -200


      # ==========================================
      # Locate Android Project
      # ==========================================
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=""

          while IFS= read -r file; do
            candidate="$(dirname "$file")"

            if [ -f "$candidate/settings.gradle" ] || \
               [ -f "$candidate/settings.gradle.kts" ]; then
              ANDROID_DIR="$candidate"
              break
            fi
          done < <(
            find extracted \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -print
          )

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            echo ""
            echo "Searching for Gradle files:"
            find extracted -type f \
              \( -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
              -o -name "build.gradle" \
              -o -name "build.gradle.kts" \) \
              -print
            exit 1
          fi

          echo "Android project found:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # Locate Web Project
      # ==========================================
      - name: Locate Web Project
        shell: bash
        run: |
          set -e

          WEB_DIR=""

          while IFS= read -r file; do
            candidate="$(dirname "$file")"

            if [ -f "$candidate/package.json" ]; then
              WEB_DIR="$candidate"
              break
            fi
          done < <(
            find extracted \
              -type f \
              -name "package.json" \
              -not -path "*/node_modules/*" \
              -print
          )

          if [ -n "$WEB_DIR" ]; then
            echo "Web project found:"
            echo "$WEB_DIR"
            echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"
          else
            echo "No package.json found."
            echo "WEB_DIR=" >> "$GITHUB_ENV"
          fi


      # ==========================================
      # Build Web Assets
      # ==========================================
      - name: Build Web Assets
        shell: bash
        run: |
          set -e

          if [ -z "$WEB_DIR" ]; then
            echo "No web project detected."
            exit 0
          fi

          cd "$WEB_DIR"

          echo "Installing web dependencies..."

          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

          echo "Building web application..."

          npm run build


      # ==========================================
      # Locate Web Build
      # ==========================================
      - name: Locate Web Build
        shell: bash
        run: |
          set -e

          WEB_DIST=""

          for candidate in \
            "$WEB_DIR/dist" \
            "$WEB_DIR/build" \
            "extracted/dist" \
            "extracted/build"
          do
            if [ -f "$candidate/index.html" ]; then
              WEB_DIST="$candidate"
              break
            fi
          done

          if [ -z "$WEB_DIST" ]; then
            echo "ERROR: Web build index.html not found"

            echo "Searching:"
            find extracted \
              -type f \
              -name "index.html" \
              -not -path "*/node_modules/*" \
              -print

            exit 1
          fi

          echo "Web build found:"
          echo "$WEB_DIST"

          echo "WEB_DIST=$WEB_DIST" >> "$GITHUB_ENV"


      # ==========================================
      # Copy Web Assets Into Android
      # ==========================================
      - name: Copy Web Assets Into Android
        shell: bash
        run: |
          set -e

          ASSETS_DIR="$ANDROID_DIR/app/src/main/assets"
          DIST_DIR="$ASSETS_DIR/dist"

          echo "Android assets:"
          echo "$ASSETS_DIR"

          echo "Web build:"
          echo "$WEB_DIST"

          mkdir -p "$ASSETS_DIR"

          # Remove old generated web files
          rm -rf "$DIST_DIR"

          # Recreate clean dist directory
          mkdir -p "$DIST_DIR"

          # IMPORTANT:
          # Copy ONLY the contents of the web dist directory.
          # Do not copy the whole extracted directory.
          cp -a "$WEB_DIST"/. "$DIST_DIR"/

          echo ""
          echo "Android web assets:"
          find "$DIST_DIR" -maxdepth 3 -type f | head -100


      # ==========================================
      # Verify Android Web Assets
      # ==========================================
      - name: Verify Android Web Assets
        shell: bash
        run: |
          set -e

          INDEX="$ANDROID_DIR/app/src/main/assets/dist/index.html"

          if [ ! -f "$INDEX" ]; then
            echo "ERROR: Android index.html not found:"
            echo "$INDEX"
            exit 1
          fi

          echo "Android index.html verified:"
          echo "$INDEX"

          echo ""
          echo "Asset files:"
          find "$ANDROID_DIR/app/src/main/assets/dist" \
            -type f | head -100


      # ==========================================
      # Install Gradle 8.10.2 DIRECTLY
      # ==========================================
      # IMPORTANT:
      # We intentionally DO NOT use:
      # gradle/actions/setup-gradle
      #
      # This avoids the corrupted/invalid
      # gradle-wrapper.jar in the ZIP.
      # ==========================================
      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -e

          GRADLE_VERSION="8.10.2"
          GRADLE_DIR="$RUNNER_TEMP/gradle-$GRADLE_VERSION"

          if [ ! -x "$GRADLE_DIR/bin/gradle" ]; then

            echo "Downloading Gradle $GRADLE_VERSION..."

            curl -fsSL \
              "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
              -o "$RUNNER_TEMP/gradle.zip"

            rm -rf "$GRADLE_DIR"

            unzip -q \
              "$RUNNER_TEMP/gradle.zip" \
              -d "$RUNNER_TEMP"

          fi

          echo "Gradle installed:"
          "$GRADLE_DIR/bin/gradle" --version

          echo "GRADLE_HOME=$GRADLE_DIR" >> "$GITHUB_ENV"
          echo "$GRADLE_DIR/bin" >> "$GITHUB_PATH"


      # ==========================================
      # Make Gradle Executable
      # ==========================================
      - name: Make Gradle Executable
        shell: bash
        run: |
          set -e

          chmod +x "$GRADLE_HOME/bin/gradle"

          "$GRADLE_HOME/bin/gradle" --version


      # ==========================================
      # Build Debug APK
      # ==========================================
      - name: Build Debug APK
        shell: bash
        working-directory: ${{ env.ANDROID_DIR }}
        run: |
          set -e

          echo "Android project:"
          pwd

          echo ""
          echo "Gradle version:"
          "$GRADLE_HOME/bin/gradle" --version

          echo ""
          echo "Building Debug APK..."

          "$GRADLE_HOME/bin/gradle" \
            assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain


      # ==========================================
      # Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" \
            -path "*/build/outputs/apk/*" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated"

            echo ""
            echo "Searching all APK files:"
            find "$ANDROID_DIR" -type f -name "*.apk" -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ==========================================
      # Upload APK
      # ==========================================
      - name: Upload SafeShield APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeShield-Debug-APK
          path: ${{ env.APK_PATH }}
          if-no-files-found: error


      # ==========================================
      # Build Summary
      # ==========================================
      - name: Build Summary
        shell: bash
        run: |
          echo "=========================================="
          echo " SafeShield APK BUILD SUCCESSFUL"
          echo "=========================================="
          echo ""
          echo "Android project:"
          echo "$ANDROID_DIR"
          echo ""
          echo "APK:"
          echo "$APK_PATH"
          echo ""
          ls -lh "$APK_PATH"
