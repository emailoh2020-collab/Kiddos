name: Build SafeShield APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout SafeShield
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Node.js 20
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # ==========================================
      # 4. Find SafeShield ZIP
      # ==========================================
      - name: Find SafeShield ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" \
            ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: SafeShield ZIP not found."
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP"

          echo "ZIP=$ZIP" >> "$GITHUB_ENV"


      # ==========================================
      # 5. Extract ZIP
      # ==========================================
      - name: Extract SafeShield ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "ZIP extracted successfully."

          echo "Project structure:"
          find extracted -maxdepth 4 -type f | head -150


      # ==========================================
      # 6. Locate Android Project
      # ==========================================
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=""

          while IFS= read -r GRADLE_FILE; do

            DIR="$(dirname "$GRADLE_FILE")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ] || \
               [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then

              ANDROID_DIR="$DIR"
              break

            fi

          done < <(find extracted -type f \
            \
              -name "gradlew" \
              -o -name "settings.gradle" \
              -o -name "settings.gradle.kts" \
            \
            -print)

          # Fallback: find directories containing Android build files
          if [ -z "$ANDROID_DIR" ]; then

            while IFS= read -r BUILD_FILE; do

              DIR="$(dirname "$BUILD_FILE")"

              if [ -f "$DIR/settings.gradle" ] || \
                 [ -f "$DIR/settings.gradle.kts" ]; then

                ANDROID_DIR="$DIR"
                break

              fi

            done < <(find extracted -type f \
              \
                -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \
              -print)

          fi

          if [ -z "$ANDROID_DIR" ]; then

            echo "ERROR: Android Gradle project not found."

            echo "Searching for Gradle files..."

            find extracted -type f \
              \
                -name "gradlew" \
                -o -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \
              -print

            exit 1
          fi

          ANDROID_DIR="$(realpath "$ANDROID_DIR")"

          echo "Android project found:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # 7. Build Web Assets
      # ==========================================
      - name: Build Web Assets
        shell: bash
        run: |
          set -e

          WEB_PROJECT=""

          # Check root project first
          if [ -f "package.json" ]; then

            WEB_PROJECT="."

          else

            PACKAGE_JSON=$(find extracted -type f \
              -name "package.json" \
              ! -path "*/node_modules/*" \
              ! -path "*/android/*" \
              -print -quit || true)

            if [ -n "$PACKAGE_JSON" ]; then
              WEB_PROJECT="$(dirname "$PACKAGE_JSON")"
            fi

          fi

          if [ -z "$WEB_PROJECT" ]; then
            echo "No package.json found."
            echo "Skipping npm build."
            exit 0
          fi

          echo "Web project:"
          echo "$WEB_PROJECT"

          cd "$WEB_PROJECT"

          if [ -f "package-lock.json" ]; then
            npm ci
          else
            npm install
          fi

          npm run build


      # ==========================================
      # 8. Locate Web Build
      # ==========================================
      - name: Locate Web Build
        shell: bash
        run: |
          set -e

          WEB_DIST=""

          # Root dist
          if [ -f "dist/index.html" ]; then

            WEB_DIST="$(realpath dist)"

          else

            # Search extracted project
            INDEX_FILE=$(find extracted -type f \
              -path "*/dist/index.html" \
              ! -path "*/node_modules/*" \
              ! -path "*/app/src/main/assets/*" \
              -print -quit || true)

            if [ -n "$INDEX_FILE" ]; then
              WEB_DIST="$(dirname "$INDEX_FILE")"
            fi

          fi

          if [ -z "$WEB_DIST" ]; then

            echo "WARNING: Web dist directory not found."

            echo "Available index.html files:"
            find extracted -type f \
              -name "index.html" \
              ! -path "*/node_modules/*" \
              -print

          else

            echo "Web build found:"
            echo "$WEB_DIST"

            echo "WEB_DIST=$WEB_DIST" >> "$GITHUB_ENV"

          fi


      # ==========================================
      # 9. Copy Web Assets
      # ==========================================
      - name: Copy Web Assets Into Android
        shell: bash
        run: |
          set -e

          DEST="$ANDROID_DIR/app/src/main/assets/dist"

          echo "Destination:"
          echo "$DEST"

          # Completely remove old web assets
          rm -rf "$DEST"

          mkdir -p "$DEST"

          if [ -n "${WEB_DIST:-}" ] && [ -d "$WEB_DIST" ]; then

            echo "Copying web build..."

            # IMPORTANT:
            # Copy CONTENTS only.
            # Do NOT create dist/dist or assets/assets.
            cp -a "$WEB_DIST"/. "$DEST"/

          else

            echo "WARNING: No web build was found."

          fi

          echo "Web assets copied."


      # ==========================================
      # 10. Verify Web Assets
      # ==========================================
      - name: Verify Android Web Assets
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets"

          echo "Final Android assets:"
          find "$ASSETS" -maxdepth 4 -type f | sort

          # Remove accidental duplicate root assets
          if [ -f "$ASSETS/index.html" ]; then
            echo "Removing duplicate root index.html"
            rm -f "$ASSETS/index.html"
          fi

          if [ -d "$ASSETS/assets" ]; then
            echo "Removing duplicate root assets directory"
            rm -rf "$ASSETS/assets"
          fi

          # Verify correct WebView entry
          if [ ! -f "$ASSETS/dist/index.html" ]; then
            echo "ERROR: Android WebView index.html not found:"
            echo "$ASSETS/dist/index
