name: Build SafeShield APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SafeShield
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract SafeShield ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: SafeShield ZIP not found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          ANDROID_DIR=$(find extracted -type f -name "settings.gradle*" -printf '%h\n' | head -n 1)

          if [ -z "$ANDROID_DIR" ]; then
            ANDROID_DIR=$(find extracted -type d -name android | head -n 1)
          fi

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android project not found."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"
          echo "Android project: $ANDROID_DIR"

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Build Web Assets
        shell: bash
        run: |
          set -e

          if [ -f package.json ]; then
            npm install
            npm run build || true
          else
            echo "No package.json found. Skipping web build."
          fi

      - name: Prepare Android Assets
        shell: bash
        run: |
          set -e

          mkdir -p "$ANDROID_DIR/app/src/main/assets/dist"

          if [ -d dist ]; then
            cp -r dist/* "$ANDROID_DIR/app/src/main/assets/dist/" || true
          elif [ -d build ]; then
            cp -r build/* "$ANDROID_DIR/app/src/main/assets/dist/" || true
          fi

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Starting SafeShield Android build..."
          echo "Using Gradle 8.10.2"
          echo "Using Java:"
          java -version

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Find APK
        shell: bash
        run: |
          set -e

          echo "Searching for generated APK..."

          APK=$(find "$ANDROID_DIR" -type f -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            find "$ANDROID_DIR" -type f | grep -E '\.(apk|aab)$' || true
            exit 1
          fi

          echo "APK FOUND:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" "$GITHUB_WORKSPACE/apk-output/SafeShield-debug.apk"

      - name: Upload SafeShield APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeShield-debug-apk
          path: apk-output/SafeShield-debug.apk
          if-no-files-found: error
