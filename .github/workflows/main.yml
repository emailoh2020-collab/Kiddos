name: Build SafeShield APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # Checkout
      # ==========================================
      - name: Checkout SafeShield
        uses: actions/checkout@v4


      # ==========================================
      # Java 17
      # ==========================================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # Node.js 20
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # ==========================================
      # Find ZIP
      # ==========================================
      - name: Find SafeShield ZIP
        shell: bash
        run: |
          set -e

          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" \
            ! -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: SafeShield ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"


      # ==========================================
      # Extract ZIP
      # ==========================================
      - name: Extract SafeShield ZIP
        shell: bash
        run: |
          set -e

          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "ZIP extracted successfully."
          echo "Searching extracted files..."

          find extracted -maxdepth 4 -type f | head -150


      # ==========================================
      # Locate Android Project
      # ==========================================
      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=""

          while IFS= read -r GRADLEW; do

            DIR="$(dirname "$GRADLEW")"

            if [ -f "$DIR/settings.gradle" ] || \
               [ -f "$DIR/settings.gradle.kts" ] || \
               [ -f "$DIR/build.gradle" ] || \
               [ -f "$DIR/build.gradle.kts" ]; then

              ANDROID_DIR="$DIR"
              break

            fi

          done < <(find extracted -type f -name "gradlew" -print)

          if [ -z "$ANDROID_DIR" ]; then

            echo "ERROR: Android Gradle project not found."

            echo "Searching for Gradle files..."

            find extracted -type f \
              \( \
                -name "gradlew" \
                -o -name "settings.gradle" \
                -o -name "settings.gradle.kts" \
                -o -name "build.gradle" \
                -o -name "build.gradle.kts" \
              \) \
              -print

            exit 1
          fi

          echo "Android project found:"
          echo "$ANDROID_DIR"

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"


      # ==========================================
      # Build Web Assets
      # ==========================================
      - name: Build Web Assets
        shell: bash
        run: |
          set -e

          WEB_PROJECT=""

          if [ -f "package.json" ]; then
            WEB_PROJECT="."
          else
            WEB_PROJECT=$(find extracted -type f -name "package.json" \
              -not -path "*/node_modules/*" \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$WEB_PROJECT" ]; then
            echo "No package.json found."
            echo "Skipping web build."
            exit 0
          fi

          echo "Web project found: $WEB_PROJECT"

          cd "$WEB_PROJECT"

          npm install
          npm run build


      # ==========================================
      # Locate Web Build
      # ==========================================
      - name: Locate Web Build
        shell: bash
        run: |
          set -e

          WEB_DIST=""

          if [ -f "dist/index.html" ]; then
            WEB_DIST="dist"
          else
            WEB_DIST=$(find extracted -type f -path "*/dist/index.html" \
              -not -path "*/android/*" \
              -print -quit | xargs -r dirname)
          fi

          if [ -z "$WEB_DIST" ]; then
            echo "WARNING: Web dist not found."
            echo "Searching for index.html..."
            find extracted -type f -name "index.html" -print
          else
            echo "Web build found: $WEB_DIST"
            echo "WEB_DIST=$WEB_DIST" >> "$GITHUB_ENV"
          fi


      # ==========================================
      # Copy Web Assets
      # ==========================================
      - name: Copy Web Assets Into Android
        shell: bash
        run: |
          set -e

          DEST="$ANDROID_DIR/app/src/main/assets/dist"

          rm -rf "$DEST"
          mkdir -p "$DEST"

          if [ -n "${WEB_DIST:-}" ] && [ -d "$WEB_DIST" ]; then

            echo "Copying web assets..."
            cp -a "$WEB_DIST"/. "$DEST"/

          else

            echo "WARNING: No web build found."
            echo "Creating empty dist directory."

          fi

          echo "Final Android web assets:"
          find "$DEST" -maxdepth 3 -type f | head -100


      # ==========================================
      # Remove Duplicate Web Assets
      # ==========================================
      - name: Verify Android Web Assets
        shell: bash
        run: |
          set -e

          ASSETS="$ANDROID_DIR/app/src/main/assets"

          echo "Checking Android assets..."

          # Remove duplicate files from assets root.
          if [ -f "$ASSETS/index.html" ]; then
            echo "Removing duplicate assets/index.html"
            rm -f "$ASSETS/index.html"
          fi

          if [ -d "$ASSETS/assets" ]; then
            echo "Removing duplicate assets/assets directory"
            rm -rf "$ASSETS/assets"
          fi

          echo "Final assets structure:"
          find "$ASSETS" -maxdepth 3 -type f | sort


      # ==========================================
      # Make Gradle Executable
      # ==========================================
      - name: Make Gradle Executable
        shell: bash
        run: |
          set -e

          if [ ! -f "$ANDROID_DIR/gradlew" ]; then
            echo "ERROR: gradlew not found."
            exit 1
          fi

          chmod +x "$ANDROID_DIR/gradlew"


      # ==========================================
      # Verify Gradle Wrapper
      # ==========================================
      - name: Verify Gradle Wrapper
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          ./gradlew --version


      # ==========================================
      # Build Debug APK
      # ==========================================
      - name: Build Debug APK
        working-directory: ${{ env.ANDROID_DIR }}
        shell: bash
        run: |
          set -e

          ./gradlew assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain


      # ==========================================
      # Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -name "*-debug.apk" \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK not found."

            find "$ANDROID_DIR" \
              -type f \
              -name "*.apk" \
              -print

            exit 1
          fi

          echo "APK found:"
          echo "$APK"

          echo "APK_PATH=$APK" >> "$GITHUB_ENV"


      # ==========================================
      # Upload APK
      # ==========================================
      - name: Upload SafeShield APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeShield-debug
          path: ${{ env.APK_PATH }}
          if-no-files-found: error
