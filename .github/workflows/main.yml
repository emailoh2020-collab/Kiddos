name: Build SafeShield APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SafeShield
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Find Android Gradle Project
        id: find_project
        shell: bash
        run: |
          echo "Searching for Gradle wrapper..."

          GRADLEW=$(find . -type f -name "gradlew" -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found."
            echo "Repository structure:"
            find . -maxdepth 4 -type f | head -200
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")

          echo "Found Gradle wrapper:"
          echo "$GRADLEW"

          echo "Android project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Make Gradle executable
        shell: bash
        run: |
          chmod +x "${{ steps.find_project.outputs.project_dir }}/gradlew"

      - name: Build Debug APK
        shell: bash
        run: |
          cd "${{ steps.find_project.outputs.project_dir }}"
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        shell: bash
        run: |
          echo "Searching for generated APK..."

          find . -type f -name "*.apk" -print

      - name: Upload SafeShield APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeShield-debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
