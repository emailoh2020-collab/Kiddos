name: Build SafeShield APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout SafeShield
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Extract SafeShield ZIP
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: SafeShield ZIP not found."
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      - name: Locate Android Project
        shell: bash
        run: |
          set -e

          ANDROID_DIR=$(find extracted -type f -name "settings.gradle*" -printf '%h\n' | head -n 1)

          if [ -z "$ANDROID_DIR" ]; then
            ANDROID_DIR=$(find extracted -type d -name android | head -n 1)
          fi

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android project not found."
            exit 1
          fi

          echo "ANDROID_DIR=$ANDROID_DIR" >> "$GITHUB_ENV"

          echo "Android project:"
          echo "$ANDROID_DIR"

      - name: Locate Web Project
        shell: bash
        run: |
          set -e

          WEB_DIR=$(find extracted -type f -name "package.json" -not -path "*/android/*" -printf '%h\n' | head -n 1)

          if [ -z "$WEB_DIR" ]; then
            echo "ERROR: Web package.json not found."
            exit 1
          fi

          echo "WEB_DIR=$WEB_DIR" >> "$GITHUB_ENV"

          echo "Web project:"
          echo "$WEB_DIR"

      - name: Install Web Dependencies
        shell: bash
        run: |
          set -e

          cd "$WEB_DIR"

          npm install

      - name: Build Web Application
        shell: bash
        run: |
          set -e

          cd "$WEB_DIR"

          npm run build

      - name: Locate index.html
        shell: bash
        run: |
          set -e

          INDEX=$(find "$WEB_DIR" -type f -name "index.html" \
            -not -path "*/node_modules/*" \
            -not -path "*/android/*" | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "ERROR: index.html was not generated."
            find "$WEB_DIR" -maxdepth 4 -type f | head -200
            exit 1
          fi

          WEB_DIST=$(dirname "$INDEX")

          echo "INDEX=$INDEX"
          echo "WEB_DIST=$WEB_DIST"

          echo "WEB_DIST=$WEB_DIST" >> "$GITHUB_ENV"

      - name: Copy Web Assets Into Android
        shell: bash
        run: |
          set -e

          ASSETS_DIR="$ANDROID_DIR/app/src/main/assets/dist"

          rm -rf "$ASSETS_DIR"
          mkdir -p "$ASSETS_DIR"

          cp -r "$WEB_DIST"/. "$ASSETS_DIR"/

          echo "Android assets:"
          find "$ASSETS_DIR" -maxdepth 2 -type f | head -100

          if [ ! -f "$ASSETS_DIR/index.html" ]; then
            echo "ERROR: index.html was not copied to Android assets."
            exit 1
          fi

          echo "SUCCESS: index.html exists inside Android assets."

      - name: Install Gradle 8.10.2
        shell: bash
        run: |
          set -e

          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip

          unzip -q gradle-8.10.2-bin.zip -d "$RUNNER_TEMP"

          echo "$RUNNER_TEMP/gradle-8.10.2/bin" >> "$GITHUB_PATH"

          gradle --version

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd "$ANDROID_DIR"

          echo "Building SafeShield..."

          gradle assembleDebug \
            --no-daemon \
            --stacktrace \
            --console=plain

      - name: Find APK
        shell: bash
        run: |
          set -e

          APK=$(find "$ANDROID_DIR" \
            -type f \
            -name "*.apk" | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo "APK:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/apk-output"

          cp "$APK" \
            "$GITHUB_WORKSPACE/apk-output/SafeShield-debug.apk"

      - name: Upload SafeShield APK
        uses: actions/upload-artifact@v4
        with:
          name: SafeShield-debug-apk
          path: apk-output/SafeShield-debug.apk
          if-no-files-found: error
