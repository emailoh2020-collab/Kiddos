name: Build SafeShield APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout SafeShield
        uses: actions/checkout@v4

      # ==============================
      # Java 17
      # ==============================
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ==============================
      # Node.js
      # ==============================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # ==============================
      # Find ZIP
      # ==============================
      - name: Find SafeShield ZIP
        shell: bash
        run: |
          ZIP=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ERROR: SafeShield ZIP not found"
            exit 1
          fi

          echo "Found ZIP: $ZIP"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      # ==============================
      # Extract ZIP
      # ==============================
      - name: Extract SafeShield ZIP
        shell: bash
        run: |
          rm -rf extracted
          mkdir -p extracted

          unzip -q "$ZIP" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f | head -100

      # ==============================
      # Locate Android Project
      # ==============================
      - name: Locate Android Project
        shell: bash
        run: |
          ANDROID_DIR=$(find extracted -type f \
            -name "settings.gradle" -o -name "settings.gradle.kts" \
            -print -quit | xargs -r dirname)

          if [ -z "$ANDROID_DIR" ]; then
            echo "ERROR: Android Gradle project not found"
            find extracted -maxdepth 
